<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Davut Eren Ekici">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>CodeTrack - Proje ve Zaman Takibi</title>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">CodeTrack</span>
            </div>
            <div class="badge-status">🟢 Sistem Aktif</div>
        </header>

        <div class="top-grid">
            <div class="glass-card time-card">
                <h3>⏱️ Canlı Çalışma Sayacı</h3>
                <div class="input-group">
                    <label for="projeSec">Çalışan Proje</label>
                    <select id="projeSec"></select>
                </div>
                <div class="timer-display" id="timer">00:00:00</div>
                <div class="timer-actions">
                    <button class="btn btn-success" id="baslatBtn">▶ Başlat</button>
                    <button class="btn btn-danger" id="durdurBtn" disabled>⏸️ Durdur & Kaydet</button>
                </div>
            </div>

            <div class="glass-card add-card">
                <h3>➕ Yeni Proje Ekle</h3>
                <form action="#" class="yeniProjeFormu">
                    <div class="input-group">
                        <label for="projeAdi">Proje Adı</label>
                        <input type="text" id="projeAdi" placeholder="Örn: Portfolyo Sitem" required>
                    </div>
                    <div class="input-group">
                        <label for="teknolojiler">Teknolojiler (Virgülle ayırın)</label>
                        <input type="text" id="teknolojiler" placeholder="Örn: HTML, CSS, JS" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Proje Oluştur</button>
                </form>
            </div>
        </div>

        <!-- GitHub Tarzı Full Genişlik Isı Haritası -->
        <div class="glass-card contribution-section">
            <div class="section-header">
                <h3>📊 Günlük Çalışma Aktivitesi (Heatmap)</h3>
            </div>
            <div class="heatmap-wrapper">
                <div class="heatmap-months" id="heatmapMonths"></div>
                <div class="heatmap-body">
                    <div class="heatmap-weekdays">
                        <span>Mon</span>
                        <span>Wed</span>
                        <span>Fri</span>
                    </div>
                    <div class="heatmap-grid" id="heatmapGrid"></div>
                </div>
                <div class="heatmap-footer">
                    <span>Az</span>
                    <div class="heatmap-legend">
                        <span class="square level-0"></span>
                        <span class="square level-1"></span>
                        <span class="square level-2"></span>
                        <span class="square level-3"></span>
                        <span class="square level-4"></span>
                    </div>
                    <span>Çok</span>
                </div>
            </div>
        </div>

        <div class="glass-card projects-section">
            <div class="section-header">
                <h3>📁 Projelerim ve Harcanan Süreler</h3>
            </div>
            <div class="project-grid" id="projeListesi"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
