<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Davut Eren Ekici">
    <link rel="stylesheet" href="Login.css">
    <title>Login</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>


<body>
    <div class="wrapper">
        <span class="bg-animate"></span>
        <span class="bg-animate2"></span>
        <div class="from-box login">
            <h2 class="animation" style="--i:0; --j:21;">Login</h2>
            <form id="loginForm">
                <form id="loginForm">
                    <div class="input-box animation" style="--i:1; --j:22;">
                        <input type="text" id="loginUsername" required>
                        <label>Kullanıcı Adı</label>
                        <i class="bx bx-user"></i>
                    </div>
                    <div class="input-box animation" style="--i:2; --j:23;">
                        <input type="password" id="loginPassword" required>
                        <label>Şifre</label>
                        <i class="bx bx-lock"></i>
                    </div>
                    <button type="submit" class="btn animation" style="--i:3; --j:24;">Giriş Yap</button>
                </form>
                <div class="logreg-link animation" style="--i:4; --j:25;">
                    <p>Hesabınız yok mu?<a href="#" class="register-link"> Hesap Oluştur</a></p>
                </div>
            </form>
        </div>
        <div class="info-text login">
            <h2 class="animation" style="--i:0; --j:20;">CodeTrack' a Hoşgeldİnİz</h2>
            <p class="animation" style="--i:1; --j:21;">Kodlama süreçlerinizi analiz edin, verimliliğinizi kolayca
                artırın.</p>
        </div>

        <!-- kayıt ol kodu -->

        <div class="from-box register">
            <h2 class="animation" style="--i:17; --j:0;">Sing Up</h2>
            <form class="registerForm">
                <div class="input-box animation" style="--i:18; --j:1;">
                    <input type="text" required>
                    <label>Kullanıcı Adı</label>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box animation" style="--i:19; --j:2;">
                    <input type="password" required>
                    <label>Şifre</label>
                    <i class="bx bx-lock"></i>
                </div>
                <div class="input-box animation" style="--i:20; --j:3;">
                    <input type="password" required>
                    <label>Şifre Tekrarı</label>
                    <i class="bx bx-lock"></i>
                </div>
                <button type="submit" class="btn animation" style="--i:21; --j:4;">Login</button>
                <div class="logreg-link animation" style="--i:22; --j:5;">
                    <p>Hesabınız var mı?<a href="#" class="login-link"> Giriş Yap</a></p>
                </div>
            </form>
        </div>
        <div class="info-text register">
            <h2 class="animation" style="--i:17; --j:0;">CodeTrack' a Hoşgeldİnİz</h2>
            <p class="animation" style="--i:18; --j:1;">Kodlama süreçlerinizi analiz edin,<br>
                verimliliğinizi kolayca artırın.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
